name: Fetch official AD alerts (FAA/EASA)

on:
  schedule:
    - cron: "17 3 * * *" # daily, ~10:17 Bangkok time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch AD alerts from FAA/EASA
        run: node scripts/fetch-ad-alerts.mjs
      - name: Commit updated snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/official-ads.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update official AD alerts snapshot"
          git push
